name: Dew
options:
  bundleIdPrefix: com.automate
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    # The version people see (CFBundleShortVersionString) and the build number (CFBundleVersion), for both
    # apps. Raise CURRENT_PROJECT_VERSION before every App Store Connect upload.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-Osize"
      SWIFT_COMPILATION_MODE: wholemodule
targets:
  Dew-macOS:
    type: application
    platform: macOS
    sources: [Shared, macOS]
    info:
      path: macOS/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleName: Dew
        CFBundleDisplayName: Dew
        LSApplicationCategoryType: public.app-category.productivity
        NSCameraUsageDescription: Websites you allow can use your camera.
        NSMicrophoneUsageDescription: Websites you allow can use your microphone.
        CFBundleURLTypes:
          - CFBundleURLName: Web site URL
            CFBundleURLSchemes: [http, https]
        NSUserActivityTypes: [com.local.dew.page]
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: macOS/Dew.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # Receives the "Sign in with ChatGPT" redirect on 127.0.0.1 (OpenAI requires a loopback redirect).
        com.apple.security.network.server: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.downloads.read-write: true
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
        com.apple.security.print: true
        # The container keeps its original name (users never see it), so synced data carries over.
        com.apple.developer.icloud-container-identifiers: [iCloud.com.local.dew]
        com.apple.developer.icloud-services: [CloudKit]
        # Chat's API keys are shared between the Mac and iOS apps through iCloud Keychain.
        # Kept from the original com.local.dew ID, so saved API keys and the passwords key stay readable.
        keychain-access-groups: [$(AppIdentifierPrefix)com.local.dew]
    settings:
      base:
        PRODUCT_NAME: Dew
        PRODUCT_BUNDLE_IDENTIFIER: com.automate.dew
        # Xcode-managed signing (team UTJ8CD785K): iCloud needs a provisioning profile. The identity
        # stays the same across builds, so Keychain access isn't re-requested.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: UTJ8CD785K
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  Dew-iOS:
    type: application
    platform: iOS
    sources: [Shared, iOS]
    info:
      path: iOS/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Dew
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        "UISupportedInterfaceOrientations~ipad": [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: Websites you allow can use your camera.
        NSMicrophoneUsageDescription: Websites you allow can use your microphone.
        NSUserActivityTypes: [com.local.dew.page]
        # Only Apple's built-in encryption (HTTPS, CryptoKit for the passwords file): exempt from export documentation.
        ITSAppUsesNonExemptEncryption: false
        # Required to be offered as the default browser (with Apple's com.apple.developer.web-browser entitlement).
        CFBundleURLTypes:
          - CFBundleURLName: Web site URL
            CFBundleURLSchemes: [http, https]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: iOS/Dew.entitlements
      properties:
        # The container keeps its original name (users never see it), so synced data carries over.
        com.apple.developer.icloud-container-identifiers: [iCloud.com.local.dew]
        com.apple.developer.icloud-services: [CloudKit]
        # Chat's API keys are shared between the Mac and iOS apps through iCloud Keychain.
        # Kept from the original com.local.dew ID, so saved API keys and the passwords key stay readable.
        keychain-access-groups: [$(AppIdentifierPrefix)com.local.dew]
    settings:
      base:
        PRODUCT_NAME: Dew
        PRODUCT_BUNDLE_IDENTIFIER: com.automate.dew
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: UTJ8CD785K
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
