<!-- Dew app icon: a blue drop and its reflection on a white tile. Rendered by Tools/render-icon.swift.
     Elements with class="mac-only" (tile shadow and hairline edge) are dropped for iOS, which masks the
     corners itself; the tile is then scaled to fill the square. -->
<svg viewBox="0 0 1024 1024" width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2f5fa"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62a8ff"/>
      <stop offset="1" stop-color="#2d5fea"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".34"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="reflection-fade">
      <rect x="0" y="672" width="1024" height="230" fill="url(#fade)"/>
    </mask>
    <filter id="tile-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0b1b3a" flood-opacity=".22"/>
    </filter>
    <clipPath id="tile"><rect id="tile-rect" x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <path id="drop" d="M512 232 C 556 302, 664 386, 664 482 A 152 152 0 0 1 512 634 A 152 152 0 0 1 360 482 C 360 386, 468 302, 512 232 Z"/>
  </defs>

  <rect class="mac-only" x="100" y="100" width="824" height="824" rx="185" fill="#fff" filter="url(#tile-shadow)"/>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#paper)"/>
    <g transform="translate(0 22)">
    <!-- reflection: the drop mirrored below itself, fading out -->
    <g mask="url(#reflection-fade)">
      <use href="#drop" fill="url(#water)" transform="translate(0 1346) scale(1 -1)"/>
    </g>
    <!-- the drop, with one small highlight -->
    <use href="#drop" fill="url(#water)"/>
    <ellipse cx="452" cy="468" rx="22" ry="44" transform="rotate(-24 452 468)" fill="#fff" fill-opacity=".5"/>
    </g>
  </g>
  <rect class="mac-only" x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#0b1b3a" stroke-opacity=".08" stroke-width="2"/>
</svg>
